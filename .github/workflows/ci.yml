# Traffic Shield CI — the automated half of the AIDevOps loop.
#
#   lint ──► unit + API tests ──► AI quality gate ──► docker build + compose validation
#
# Every stage runs on a bare GitHub runner: no GPU, no Ollama, no Neo4j, no
# API keys. The LLM, retriever, Chroma and Neo4j are mocked in tests, and the
# AI quality gate scores the committed outputs of the last real eval run
# (see evaluation/quality_gate.py for why the 8B model is not re-run per push).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests & AI quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter as the service image (Dockerfile: python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check services evaluation scripts data_pipeline tests

      - name: Unit + API tests (pytest)
        run: pytest -v --junitxml=pytest-report.xml

      - name: AI quality gate (retrieval, hallucination, guardrail red-team)
        # Writes a metrics table to this run's Summary page; non-zero exit on
        # any regression past evaluation/quality_baseline.json fails the build.
        run: python -m evaluation.quality_gate

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  docker:
    name: Docker build & compose validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.monitoring.yml config -q

      - name: Validate Prometheus config + alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml

      - name: Build service image
        run: docker build -t trafficshield-services:ci .

      - name: Build frontend image
        run: docker build -t trafficshield-frontend:ci ./frontend

      - name: Smoke-test the built image
        # Boots one real service from the freshly built image and checks that
        # /v1/health and /metrics answer — proves the image starts, not just builds.
        run: |
          docker run -d --name smoke -p 8001:8001 trafficshield-services:ci \
            python -m uvicorn services.orchestration_service.main:app --host 0.0.0.0 --port 8001
          for i in $(seq 1 30); do
            curl -sf localhost:8001/v1/health && break
            sleep 1
          done
          curl -sf localhost:8001/v1/health
          curl -sf localhost:8001/metrics | grep -q ts_guardrail_decisions_total
          echo "image smoke test passed"

      - name: Smoke-test logs
        if: failure()
        run: docker logs smoke || true
