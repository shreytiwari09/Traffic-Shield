# Prometheus scrape config — used by docker-compose.yml (full containerised
# stack). Targets are Docker DNS names on the `trafficshield` network.
# For services run locally from .venv, see prometheus.local.yml.
global:
  scrape_interval: 5s       # short on purpose: live demo, tiny metric volume
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: trafficshield
    metrics_path: /metrics
    static_configs:
      - targets:
          - app_service:8000
          - orchestration_service:8001
          - retrieval_service:8002
          - llm_service:8003
          - data_service:8004
