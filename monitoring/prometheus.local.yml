# Prometheus scrape config for LOCAL mode — the five services run on the host
# from .venv (uvicorn on 8000-8004) and only Prometheus + Grafana run in
# Docker, via docker-compose.monitoring.yml. host.docker.internal is the host
# as seen from inside a Docker Desktop container.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: trafficshield
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
          - host.docker.internal:8001
          - host.docker.internal:8002
          - host.docker.internal:8003
          - host.docker.internal:8004
