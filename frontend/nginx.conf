# Serves the built React app and forwards /api/* to Application Service.
#
# This is the containerised equivalent of the Vite dev server's proxy block
# (vite.config.js). The browser still only ever talks to ONE origin, so no CORS
# configuration is needed in any FastAPI service — exactly as in local dev.
# vite.config.js is left untouched: `npm run dev` on the host keeps proxying to
# localhost:8000, while in Docker nginx proxies to the app_service container.
# The React code needs no change either, because frontend/src/api.js already
# uses relative /api/* paths.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application Service is the single front door — nothing here talks to
    # orchestration/retrieval/llm/data directly, matching the architecture.
    location /api/ {
        proxy_pass http://app_service:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events (GET /api/ask/stream) ---------------------
        # The live pipeline trace is real SSE, so nginx must not buffer: with
        # default buffering the whole stream arrives at once when the request
        # ends, and the "live" trace stops being live. Clearing Connection
        # keeps the upstream connection from being closed as a hop-by-hop
        # header.
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';

        # Generous timeouts: one Ollama answer on CPU-only hardware can take
        # minutes, and nginx timing out mid-generation would surface as a
        # confusing 504 rather than the real cause.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SPA fallback — the app is client-routed, so unknown paths must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
